[project]
name = "finpersona"
version = "0.1.0"
description = "FinPersona: Modeling MBTI Personality in Financial Trading Agents"
authors = [
    { name = "Ayesha Gull", email = "ayeshaiqbal2592@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pandas",
    "yfinance",
    "vectorbt",
    "pydantic>=2.0",
    "langchain",
    "langchain-google-genai",
    "langchain-anthropic",
    "langchain-openai",
    "python-dotenv",
    "tqdm",
    "streamlit>=1.30",
    # the v2.1 analysis layer: imported by evaluation/ and tools/ and undeclared until 30 Oct 2026.  Lower bounds
    # only -- the versions in use are recorded beside, because the Phase-8 known answers were re-checked under them.
    "numpy>=1.26",          # in use: 2.2.6
    "scipy>=1.11",          # in use: 1.16.1
    "scikit-learn>=1.3",    # in use: 1.9.1   -- evaluation/salience.py, evaluation/leakage_audit.py
    "joblib>=1.3",          # in use: 1.6.0   -- evaluation/salience.py thread control
    "statsmodels>=0.14",    # in use: 0.15.0  -- tools/stats_v2.py crossed mixed model, evaluation/stylized_facts.py
    "arch>=6.2",            # GARCH fits in tools/phase1 and tools/phase3
    "matplotlib>=3.7",      # tools/history_figures.py
    "python-docx>=1.1",     # tools/history_docx.py
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "mypy",
    "black"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "results*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["venv", ".venv", ".git"]
addopts = "-p no:cacheprovider"

[tool.mypy]
cache_dir = "venv/.mypy_cache"
exclude = ["venv", ".venv", "build", "dist"]
ignore_missing_imports = true
incremental = false
